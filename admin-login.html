<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>管理員登入 - 軟筋生物</title>
    <link rel="icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./css/style.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .login-container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 400px;
        width: 100%;
        animation: slideUp 0.5s ease-out;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-header {
        text-align: center;
        margin-bottom: 30px;
      }

      .login-header h1 {
        color: #333;
        font-size: 28px;
        margin-bottom: 10px;
      }

      .login-header p {
        color: #666;
        font-size: 14px;
      }

      .login-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .form-group label {
        color: #333;
        font-size: 14px;
        font-weight: 500;
      }

      .form-group input {
        padding: 12px 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 16px;
        transition: all 0.3s ease;
      }

      .form-group input:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      .form-group input.error {
        border-color: #e74c3c;
      }

      .password-wrapper {
        position: relative;
      }

      .password-toggle {
        position: absolute;
        right: 12px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #667eea;
        cursor: pointer;
        font-size: 14px;
        padding: 0;
        user-select: none;
        transition: color 0.3s ease;
      }

      .password-toggle:hover {
        color: #764ba2;
      }

      .password-toggle:focus {
        outline: none;
        color: #764ba2;
      }

      .error-message {
        color: #e74c3c;
        font-size: 12px;
        margin-top: -5px;
        display: none;
      }

      .error-message.show {
        display: block;
      }

      .login-button {
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 10px;
      }

      .login-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }

      .login-button:active {
        transform: translateY(0);
      }

      .login-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }

      .loading {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(255, 255, 255, 0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-right: 8px;
        vertical-align: middle;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .back-link {
        text-align: center;
        margin-top: 20px;
      }

      .back-link a {
        color: #667eea;
        text-decoration: none;
        font-size: 14px;
        transition: color 0.3s ease;
      }

      .back-link a:hover {
        color: #764ba2;
      }

      .alert {
        padding: 12px 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
        display: none;
      }

      .alert.show {
        display: block;
      }

      .alert.error {
        background: #fee;
        color: #c33;
        border: 1px solid #fcc;
      }

      .alert.success {
        background: #efe;
        color: #3c3;
        border: 1px solid #cfc;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <h1>管理員登入</h1>
        <p>軟筋生物 - 管理後台</p>
      </div>

      <div id="alert" class="alert"></div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="email">電子郵件</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="請輸入您的電子郵件"
            required
            autocomplete="email"
          />
          <span class="error-message" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="password">密碼</label>
          <div class="password-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="請輸入您的密碼"
              required
              autocomplete="current-password"
              style="padding-right: 90px"
            />
            <button
              type="button"
              class="password-toggle"
              id="passwordToggle"
              aria-label="顯示密碼"
            >
              顯示密碼
            </button>
          </div>
          <span class="error-message" id="passwordError"></span>
        </div>

        <button type="submit" class="login-button" id="loginButton">
          登入
        </button>
      </form>

      <div class="back-link">
        <a href="./index.html">← 返回首頁</a>
      </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <!-- Firebase 配置和認證模組 -->
    <script src="./js/firebase-config.js"></script>
    <script src="./js/firebase-auth.js"></script>

    <!-- 登入邏輯 -->
    <script>
      // 初始化 Firebase Auth
      let authInitialized = false;

      async function initAuth() {
        if (authInitialized) return;

        try {
          const success = await window.FirebaseAuth.init();
          if (success) {
            authInitialized = true;
            // 檢查是否已經登入
            checkAuthState();
          } else {
            showAlert("無法初始化身份驗證系統，請檢查 Firebase 配置", "error");
          }
        } catch (error) {
          console.error("初始化失敗:", error);
          showAlert("初始化失敗，請重新整理頁面", "error");
        }
      }

      // 檢查身份驗證狀態
      function checkAuthState() {
        window.FirebaseAuth.onAuthStateChanged((user) => {
          if (user) {
            // 已經登入，重定向到管理後台
            window.location.href = "./admin.html";
          }
        });
      }

      // 顯示提示訊息
      function showAlert(message, type = "error") {
        const alert = document.getElementById("alert");
        alert.textContent = message;
        alert.className = `alert ${type} show`;

        setTimeout(() => {
          alert.classList.remove("show");
        }, 5000);
      }

      // 表單提交處理
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const loginButton = document.getElementById("loginButton");
          const emailError = document.getElementById("emailError");
          const passwordError = document.getElementById("passwordError");

          // 清除錯誤訊息
          emailError.textContent = "";
          emailError.classList.remove("show");
          passwordError.textContent = "";
          passwordError.classList.remove("show");
          document.getElementById("alert").classList.remove("show");

          // 驗證輸入
          if (!email) {
            emailError.textContent = "請輸入電子郵件";
            emailError.classList.add("show");
            document.getElementById("email").classList.add("error");
            return;
          }

          if (!password) {
            passwordError.textContent = "請輸入密碼";
            passwordError.classList.add("show");
            document.getElementById("password").classList.add("error");
            return;
          }

          // 禁用按鈕並顯示載入狀態
          loginButton.disabled = true;
          loginButton.innerHTML = '<span class="loading"></span>登入中...';

          try {
            // 確保 Firebase Auth 已初始化
            if (!authInitialized) {
              await initAuth();
            }

            // 執行登入
            const result = await window.FirebaseAuth.signIn(email, password);

            if (result.success) {
              showAlert("登入成功！正在跳轉...", "success");
              // 等待一下再跳轉，讓用戶看到成功訊息
              setTimeout(() => {
                window.location.href = "./admin.html";
              }, 500);
            } else {
              showAlert(result.error || "登入失敗，請檢查帳號密碼", "error");
              loginButton.disabled = false;
              loginButton.textContent = "登入";
            }
          } catch (error) {
            console.error("登入錯誤:", error);
            showAlert("登入時發生錯誤，請稍後再試", "error");
            loginButton.disabled = false;
            loginButton.textContent = "登入";
          }
        });

      // 顯示/隱藏密碼功能
      const passwordInput = document.getElementById("password");
      const passwordToggle = document.getElementById("passwordToggle");

      if (passwordToggle) {
        passwordToggle.addEventListener("click", () => {
          const type =
            passwordInput.getAttribute("type") === "password"
              ? "text"
              : "password";
          passwordInput.setAttribute("type", type);

          // 更新按鈕文字
          passwordToggle.textContent =
            type === "password" ? "顯示密碼" : "隱藏密碼";
        });
      }

      // 移除錯誤樣式
      document.getElementById("email").addEventListener("input", () => {
        document.getElementById("email").classList.remove("error");
        document.getElementById("emailError").classList.remove("show");
      });

      document.getElementById("password").addEventListener("input", () => {
        document.getElementById("password").classList.remove("error");
        document.getElementById("passwordError").classList.remove("show");
      });

      // 頁面載入時初始化
      document.addEventListener("DOMContentLoaded", () => {
        initAuth();
      });
    </script>
  </body>
</html>
